<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  /* 关键词弹出强调：每组的「关键词」（Python 侧标记 emphasize=true）放大变色弹跳 */
  html, body { margin: 0; width: __WIDTH__px; height: __HEIGHT__px; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 100%; height: 100%; }
  .grp {
    position: absolute; left: 0; width: 100%;
    display: flex; justify-content: center; align-items: center; flex-wrap: wrap;
    padding: 0 6%; box-sizing: border-box;
    text-align: center; line-height: 1.3;
    font-family: "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: 900; font-size: __FONT_SIZE__px;
    color: var(--cap-color, #ffffff);
    visibility: hidden;
    text-shadow: 0 0 2px rgba(0,0,0,.9), 2.5px 2.5px 0 #000, -2.5px 2.5px 0 #000, 2.5px -2.5px 0 #000, -2.5px -2.5px 0 #000, 0 8px 22px rgba(0,0,0,.6);
  }
  .grp .w { display: inline-block; white-space: pre; will-change: transform, color, scale; }
  .grp .w.em { color: var(--cap-hl, #ff4d6d); }
  .pos-bottom .grp { top: 66%; }
  .pos-center .grp { top: 38%; }
</style>
</head>
<body>
<div id="stage" class="pos-__POSITION__" data-composition-id="captions" data-start="0" data-duration="__DURATION__" data-width="__WIDTH__" data-height="__HEIGHT__"></div>
<script>
const DATA = window.__CAPTION_DATA__;
const P = Object.assign({ color: "#ffffff", highlight: "#ff4d6d", position: "bottom" }, DATA.params || {});
const stage = document.getElementById("stage");
stage.style.setProperty("--cap-color", P.color);
stage.style.setProperty("--cap-hl", P.highlight);

const tl = gsap.timeline({ paused: true });
DATA.groups.forEach((g, gi) => {
  const el = document.createElement("div");
  el.className = "grp";
  const wordEls = [];
  g.words.forEach((w, wi) => {
    const s = document.createElement("span");
    s.className = "w" + (w.em ? " em" : "");
    s.textContent = w.t + (wi < g.words.length - 1 ? " " : "");
    el.appendChild(s);
    wordEls.push(s);
  });
  stage.appendChild(el);
  // 整组上滑入场
  tl.set(el, { visibility: "visible", y: 34, opacity: 0 }, g.start);
  tl.to(el, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, g.start);
  // 关键词弹出：scale 0.4→1.18→1 弹跳 + 高亮色
  g.words.forEach((w, wi) => {
    if (!w.em) return;
    tl.fromTo(wordEls[wi],
      { scale: 0.4, rotate: -4 },
      { scale: 1.18, rotate: 0, duration: 0.16, ease: "back.out(2.2)" }, w.s);
    tl.to(wordEls[wi], { scale: 1, duration: 0.1, ease: "power2.out" }, w.s + 0.16);
  });
  tl.to(el, { opacity: 0, y: -22, duration: 0.16, ease: "power1.in" }, Math.max(g.start, g.end - 0.16));
  tl.set(el, { visibility: "hidden" }, g.end);
});
tl.set({}, {}, DATA.duration);
window.__timelines["captions"] = tl;
tl.seek(0);
</script>
</body>
</html>
