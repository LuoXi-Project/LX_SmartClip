<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  /* 打字机逐字出现 + 方块光标 */
  html, body { margin: 0; width: __WIDTH__px; height: __HEIGHT__px; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 100%; height: 100%; }
  .grp {
    position: absolute; left: 0; width: 100%;
    display: flex; justify-content: center; align-items: center;
    padding: 0 7%; box-sizing: border-box;
    text-align: center; line-height: 1.35;
    font-family: "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: 800; font-size: __FONT_SIZE__px;
    color: var(--cap-color, #e8f4ff);
    visibility: hidden;
    text-shadow: 0 0 3px rgba(0,0,0,.95), 2px 2px 0 #001326, -2px 2px 0 #001326, 2px -2px 0 #001326, -2px -2px 0 #001326;
  }
  .grp .ch { display: inline-block; white-space: pre; opacity: 0; }
  .grp .cur {
    display: inline-block; width: 0.55em; height: 1.05em; margin-left: 0.08em;
    background: var(--cap-cursor, #37e5ff); vertical-align: -0.12em; opacity: 0;
  }
  .pos-bottom .grp { top: 74%; }
  .pos-center .grp { top: 42%; }
</style>
</head>
<body>
<div id="stage" class="pos-__POSITION__" data-composition-id="captions" data-start="0" data-duration="__DURATION__" data-width="__WIDTH__" data-height="__HEIGHT__"></div>
<script>
const DATA = window.__CAPTION_DATA__;
const P = Object.assign({ color: "#e8f4ff", cursor: "#37e5ff", position: "bottom" }, DATA.params || {});
const stage = document.getElementById("stage");
stage.style.setProperty("--cap-color", P.color);
stage.style.setProperty("--cap-cursor", P.cursor);

const tl = gsap.timeline({ paused: true });
DATA.groups.forEach((g, gi) => {
  const el = document.createElement("div");
  el.className = "grp";
  const chars = [];
  // 逐字 span：直接按组文本切（词信息仅用于节奏）
  for (const c of g.text) {
    const s = document.createElement("span");
    s.className = "ch";
    s.textContent = c;
    el.appendChild(s);
    chars.push(s);
  }
  const cur = document.createElement("span");
  cur.className = "cur";
  el.appendChild(cur);

  const dur = g.end - g.start;
  // 光标闪烁周期 0.4s：从组开始前 0.2s 亮到组结束
  for (let t = g.start - 0.2; t < g.end; t += 0.4) {
    tl.set(cur, { opacity: 1 }, Math.max(0, t));
    tl.set(cur, { opacity: 0.15 }, Math.max(0, t + 0.2));
  }
  stage.appendChild(el);
  tl.set(el, { visibility: "visible" }, g.start);
  // 逐字出现：组时长按字符数均分（有词级时间则词内字符按词窗口排布）
  const per = dur / Math.max(1, chars.length);
  let cursor = g.start;
  let ci = 0;
  g.words.forEach((w) => {
    const wChars = Array.from(w.t);
    const wSpan = Math.max(0.03, (w.e - w.s) / Math.max(1, wChars.length));
    wChars.forEach(() => {
      tl.set(chars[ci], { opacity: 1 }, Math.min(cursor, g.end - 0.03));
      cursor += wSpan;
      ci += 1;
    });
  });
  // 兜底：词级缺失/字符数不一致时按均分补齐剩余字符
  while (ci < chars.length) {
    tl.set(chars[ci], { opacity: 1 }, g.start + per * ci);
    ci += 1;
  }
  tl.set(cur, { opacity: 0 }, g.end - 0.05);
  tl.to(el, { opacity: 0, duration: 0.12, ease: "power1.in" }, Math.max(g.start, g.end - 0.12));
  tl.set(el, { visibility: "hidden" }, g.end);
});
tl.set({}, {}, DATA.duration);
window.__timelines["captions"] = tl;
tl.seek(0);
</script>
</body>
</html>
